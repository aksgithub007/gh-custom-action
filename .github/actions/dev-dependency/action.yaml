name: Cache and Dev dependency
description: we are combine all common step for cache and install depedency
inputs:
  caching:
    description: added flag caching through custom action input
    required: false
    default: "true"
outputs:
  cache-info:
    description: provide information that cache is used or not
    value: ${{steps.install.outputs.cacheInfo}}
runs:
  using: "composite"
  steps:
    - name: Cache dependencies
      if: inputs.caching == true
      id: cache
      uses: actions/cache@v6
      with:
        path: node_modules
        key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
    - name: Install dependencies
      if: steps.cache.outputs.cache-hit != 'true' || inputs.caching != 'true'
      id: install
      run: |
        npm ci
        echo 'cacheInfo=${{ inputs.caching }}' >> $GITHUB_OUTPUT
      shell: bash
